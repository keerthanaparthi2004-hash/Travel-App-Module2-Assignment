<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Travel App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <span class="navbar-brand">
                    <img src="Images/logo.jpg" width="30" class="me-2">TravelApp</span>
            </div>
        </nav>
    </header>
    <main class="container my-5">
        <section class="form-container mx-auto">
            <div class="card shadow p-4">
                <h2 class="text-center mb-3">Welcome Back</h2>
                <form id="signinForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" id="signinEmail" class="form-control" placeholder="example@mail.com">
                        <small class="text-danger" id="signinEmailError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <div class="input-group">
                            <input type="password" id="signinPassword" class="form-control" placeholder="Enter password">
                            <span class="input-group-text" onclick="togglePassword('signinPassword','eye3')"><i id="eye3" class="bi bi-eye"></i></span>
                        </div>
                        <small class="text-danger" id="signinPassError"></small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    <p class="text-center mt-3">Don't have account? <a href="SignUp.html">Sign Up</a></p>
                    <small class="text-danger text-center d-block" id="loginError"></small>
                </form>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>&copy; 2026 TravelApp</p>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
