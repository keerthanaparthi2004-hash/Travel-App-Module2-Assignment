<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<header>
    <nav class="navbar bg-primary navbar-dark">
        <div class="container">
            <span class="navbar-brand">
                <img src="Images/logo.jpg" width="35" height="35" style="object-fit:cover; border-radius:50%; background:white; padding:2px;" class="me-2" alt="logo">

                    <button class="btn btn-primary btn-sm">Book Now</button>
                </div>
