<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Travel App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <span class="navbar-brand"><img src="Images/logo.jpg" width="30" class="me-2">TravelApp</span>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <section class="form-container mx-auto">
            <div class="card shadow p-4">
                <h2 class="text-center mb-3">Create Account</h2>
                <form id="signupForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="fullname" class="form-control" placeholder="Enter full name">
                        <small class="text-danger" id="nameError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" id="email" class="form-control" placeholder="example@mail.com">
                        <small class="text-danger" id="emailError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="phone" class="form-control" placeholder="10 digit number">
                        <small class="text-danger" id="phoneError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location/City *</label>
                        <input type="text" id="city" class="form-control" placeholder="Enter city">
                        <small class="text-danger" id="cityError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" placeholder="Min 8 chars, letters+numbers">
                            <span class="input-group-text" onclick="togglePassword('password','eye1')"><i id="eye1" class="bi bi-eye"></i></span>
                        </div>
                        <small class="text-danger" id="passError"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password *</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
                            <span class="input-group-text" onclick="togglePassword('confirmPassword','eye2')"><i id="eye2" class="bi bi-eye"></i></span>
                        </div>
                        <small class="text-danger" id="confirmError"></small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    <p class="text-center mt-3">Already have account? <a href="SignIn.html">Sign In</a></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>&copy; 2026 TravelApp | Module 2 Assignment</p>
    </footer>

    <script src="js/index.js"></script>
</body>
</html>
